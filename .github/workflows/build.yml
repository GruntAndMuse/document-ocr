name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONUTF8: 1  # Windows consoles default to cp1252; the CLI prints Unicode (→)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Smoke test — CLI help
        run: python doc-ocr --help

      - name: Smoke test — shared library imports
        run: python -c "import gruntandmuse_shared; print('shared lib OK')"

      - name: QC gates test suite
        run: python tests/test_qc_gates.py

      - name: QC gates — build sample PDFs and run the gates
        # End-to-end gate exercise on synthetic fixtures (tests/make_qc_fixtures.py
        # generates them — the real test scans are gitignored, never committed).
        # No shell globs: Windows PowerShell doesn't expand them, so the
        # builders take --json-dir instead. A gate failure fails this job.
        run: |
          python tests/make_qc_fixtures.py /tmp/qc-fix
          python scripts/make_demo_pdf.py --pages /tmp/qc-fix/pages --json-dir /tmp/qc-fix/json /tmp/qc-orig.pdf
          python scripts/build_dewarped_searchable.py --pages /tmp/qc-fix/pages --json-dir /tmp/qc-fix/json /tmp/qc-dewarp.pdf
          python scripts/qc_gates.py --pdf /tmp/qc-dewarp.pdf --originals-pdf /tmp/qc-orig.pdf --json-dir /tmp/qc-fix/json --manifest /tmp/qc-fix/manifest.json --sample 4
